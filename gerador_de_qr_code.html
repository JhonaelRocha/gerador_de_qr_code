<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#F4F6F8;--card:#fff;--text:#263238;--muted:#607D8B;--line:#CFD8DC;--prev:#FAFAFA;--accent:#FF9800;--accent-d:#E68900;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171a;--card:#1c2327;--text:#ECEFF1;--muted:#90A4AE;--line:#37474F;--prev:#263238;--field:#12171a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171a;--card:#1c2327;--text:#ECEFF1;--muted:#90A4AE;--line:#37474F;--prev:#263238;--field:#12171a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:var(--accent);color:#fff;padding:22px 28px}
header h1{margin:0;font-size:26px}header p{margin:6px 0 0;font-weight:700;font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;padding:28px;max-width:1200px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr;padding:16px}header{padding:18px 16px}}
.card{background:var(--card);border-radius:8px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label,.lbl{display:block;font-weight:600;margin-bottom:8px}
.lbl.big{font-size:16px}
input[type=text],select{width:100%;height:40px;padding:6px 10px;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:4px;margin-bottom:18px}
input[type=text]:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:18px}
.grid span{display:block;font-size:12px;color:var(--muted)}
.grid b{font-weight:600;color:var(--text)}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font:inherit;font-weight:600;color:#fff;border:0;border-radius:4px;height:42px;padding:0 20px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#gen{background:var(--accent);min-width:170px}#gen:hover{background:var(--accent-d)}
#png{background:#2E7D32}#svg{background:#6A1B9A}
#status{margin:18px 0 0;color:var(--muted)}
.prev{display:flex;flex-direction:column}
.prev h2{margin:0;font-size:16px;text-align:center}
#box{flex:1;min-height:280px;margin:14px 0;border:1px solid var(--line);background:var(--prev);display:flex;align-items:center;justify-content:center;padding:12px;color:var(--muted);text-align:center}
#box svg{width:100%;max-width:420px;height:auto;aspect-ratio:1/1;display:block;background:#fff}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1>Gerador de QR Code</h1><p>Insira um link para criar seu código</p></header>
<main>
<section class="card">
  <label class="lbl big" for="url">URL ou link</label>
  <input type="text" id="url" placeholder="https://www.exemplo.com" inputmode="url" autocomplete="off" title="Exemplo: https://www.exemplo.com">
  <label for="logo">Logo central</label>
  <select id="logo">
    <option value="">Nenhum</option><option value="whatsapp">WhatsApp</option><option value="instagram">Instagram</option><option value="maps">Maps</option><option value="google">Google</option>
  </select>
  <div class="lbl">Ajustes da logo (pixels)</div>
  <div class="grid">
    <div><span>Offset X: <b id="vx">0</b></span><input type="range" id="ox" min="-20" max="20" value="0" step="1"></div>
    <div><span>Offset Y: <b id="vy">0</b></span><input type="range" id="oy" min="-20" max="20" value="0" step="1"></div>
    <div><span>Tamanho: <b id="vs">120</b></span><input type="range" id="sz" min="25" max="250" value="120" step="1"></div>
    <div><span>Círculo: <b id="vc">180</b></span><input type="range" id="ci" min="25" max="250" value="180" step="1"></div>
  </div>
  <button id="gen">Gerar QR Code</button>
  <p id="status" role="status">Digite um link e clique em Gerar QR Code.</p>
</section>
<section class="card prev">
  <h2>Pré-visualização</h2>
  <div id="box">O QR Code aparecerá aqui</div>
  <div class="btns"><button id="png" disabled>Salvar como PNG</button><button id="svg" disabled>Salvar como SVG</button></div>
</section>
</main>

const cache={};let current=null;
function bbox(k){if(!cache[k]){const s=document.createElementNS(NS,"svg");s.setAttribute("style","position:absolute;width:0;height:0;visibility:hidden");
 const p=document.createElementNS(NS,"path");p.setAttribute("d",LOGOS[k]);s.appendChild(p);document.body.appendChild(s);cache[k]=p.getBBox();s.remove();}return cache[k];}
function validUrl(t){try{const u=new URL(t);return u.protocol==="http:"||u.protocol==="https:"}catch{return false}}
function buildSvg(text){
 const qr=qrcode(0,"Q");qr.addData(text);qr.make();
