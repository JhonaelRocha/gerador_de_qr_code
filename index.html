<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{--bg:#F4F6F8;--card:#fff;--text:#263238;--muted:#607D8B;--line:#CFD8DC;--prev:#FAFAFA;--accent:#FF9800;--accent-d:#E68900;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171a;--card:#1c2327;--text:#ECEFF1;--muted:#90A4AE;--line:#37474F;--prev:#263238;--field:#12171a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171a;--card:#1c2327;--text:#ECEFF1;--muted:#90A4AE;--line:#37474F;--prev:#263238;--field:#12171a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:var(--accent);color:#fff;padding:22px 28px}
header h1{margin:0;font-size:26px}header p{margin:6px 0 0;font-weight:700;font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;padding:28px;max-width:1200px;margin:0 auto;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr;padding:16px}header{padding:18px 16px}}
.card{background:var(--card);border-radius:8px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.prev{position:sticky;top:12px;display:flex;flex-direction:column}
@media(max-width:820px){.prev{position:static;order:-1}}
h3{margin:22px 0 12px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
h3:first-of-type{margin-top:0;padding-top:0;border:0}
label,.lbl{display:block;font-weight:600;margin-bottom:6px;font-size:14px}
.lbl.big{font-size:16px}
input[type=text],select{width:100%;height:38px;padding:6px 10px;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:4px}
input[type=text]:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=color]{width:100%;height:38px;padding:2px;background:var(--field);border:1px solid var(--line);border-radius:4px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:6px}
.grid span{display:block;font-size:12px;color:var(--muted)}
.grid b{font-weight:600;color:var(--text)}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:0;height:38px;align-self:end}
.chk input{accent-color:var(--accent);width:18px;height:18px}
.full{grid-column:1/-1}
input[type=file]{font-size:13px;width:100%;color:var(--muted)}
button{font:inherit;font-weight:600;color:#fff;border:0;border-radius:4px;height:42px;padding:0 20px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#gen{background:var(--accent);margin-top:20px;min-width:170px}#gen:hover{background:var(--accent-d)}
#png{background:#2E7D32}#svg{background:#6A1B9A}
#status{margin:14px 0 0;color:var(--muted)}
.prev h2{margin:0;font-size:16px;text-align:center}
#box{min-height:280px;margin:14px 0;border:1px solid var(--line);background:var(--prev);display:flex;align-items:center;justify-content:center;padding:12px;color:var(--muted);text-align:center;
background-image:linear-gradient(45deg,rgba(128,128,128,.12) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.12) 75%),linear-gradient(45deg,rgba(128,128,128,.12) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.12) 75%);background-size:20px 20px;background-position:0 0,10px 10px}
#box svg{width:100%;max-width:420px;height:auto;aspect-ratio:1/1;display:block}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btns select{width:auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;height:38px;background:var(--field);color:var(--text);border:1px solid var(--line)}
.tab[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
textarea{width:100%;padding:8px 10px;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:4px;resize:vertical}
.pane[hidden]{display:none}
#cp{background:#455A64}
#test{margin-top:14px;font-size:13px}#test ul{list-style:none;padding:0;margin:6px 0}
#test .ok{color:#43A047}#test .bad{color:#E53935}#test .na{color:var(--muted)}#test .note{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><h1>Gerador de QR Code</h1><p>Insira um link e personalize seu código</p></header>
<main>
<section class="card">
  <h3>Conteúdo</h3>
  <div class="tabs"><button class="tab" data-t="link" aria-pressed="true">Link</button><button class="tab" data-t="wa" aria-pressed="false">WhatsApp</button><button class="tab" data-t="pix" aria-pressed="false">Pix</button></div>
  <div class="pane" id="p-link">
    <label class="lbl big" for="url">URL ou link</label>
    <input type="text" id="url" placeholder="https://www.exemplo.com" inputmode="url" autocomplete="off">
  </div>
  <div class="pane" id="p-wa" hidden>
    <label for="wn">Número com DDD</label>
    <input type="text" id="wn" placeholder="(85) 99999-9999" inputmode="tel" autocomplete="off" style="margin-bottom:12px">
    <label for="wm">Mensagem (opcional)</label>
    <textarea id="wm" rows="3" placeholder="Olá! Gostaria de mais informações."></textarea>
  </div>
  <div class="pane" id="p-pix" hidden>
    <div class="grid">
      <div><label for="kt">Tipo de chave</label><select id="kt"><option value="cpf">CPF</option><option value="cnpj">CNPJ</option><option value="tel">Telefone</option><option value="email">E-mail</option><option value="rand">Chave aleatória</option></select></div><div><label for="pk">Chave Pix</label><input type="text" id="pk" placeholder="000.000.000-00" autocomplete="off"></div>
      <div><label for="pn">Nome do recebedor</label><input type="text" id="pn" maxlength="25" autocomplete="off"></div>
      <div><label for="pc">Cidade</label><input type="text" id="pc" maxlength="15" autocomplete="off"></div>
      <div><label for="pv">Valor (opcional)</label><input type="text" id="pv" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
      <div><label for="pt">Identificador (opcional)</label><input type="text" id="pt" maxlength="25" autocomplete="off"></div>
      <div class="full"><label for="pd">Mensagem (opcional)</label><input type="text" id="pd" maxlength="40" autocomplete="off"></div>
    </div>
  </div>

  <h3>Cores e estilo</h3>
  <div class="grid">
    <div><label for="fg">Cor do QR</label><input type="color" id="fg" value="#000000"></div>
    <div><label for="bg">Cor do fundo</label><input type="color" id="bg" value="#ffffff"></div>
    <label class="chk"><input type="checkbox" id="tr"> Fundo transparente</label>
    <div><label for="mod">Formato dos módulos</label><select id="mod"><option value="sq">Quadrado</option><option value="rd">Arredondado</option><option value="dot">Pontos</option></select></div>
    <div><label for="ecc">Correção de erro</label><select id="ecc"><option value="L">L (7%)</option><option value="M">M (15%)</option><option value="Q" selected>Q (25%)</option><option value="H">H (30%)</option></select></div>
    <div><span>Margem (módulos): <b data-v="qz">4</b></span><input type="range" id="qz" min="0" max="8" value="4"></div>
  </div>

  <h3>Moldura</h3>
  <div class="grid">
    <div><label for="frame">Tipo de borda</label><select id="frame"><option value="none">Sem borda</option><option value="sq">Quadrada</option><option value="round">Cantos arredondados</option></select></div>
    <div><label for="fc">Cor da borda</label><input type="color" id="fc" value="#000000"></div>
    <div class="full"><span>Espessura: <b data-v="fw">12</b></span><input type="range" id="fw" min="2" max="40" value="12"></div>
  </div>

  <h3>Logo central</h3>
  <div class="grid">
    <div><label for="logo">Logo</label><select id="logo"><option value="">Nenhum</option><option value="whatsapp">WhatsApp</option><option value="instagram">Instagram</option><option value="maps">Maps</option><option value="google">Google</option></select></div>
    <div><label for="lc">Cor da logo</label><input type="color" id="lc" value="#000000"></div>
    <div class="full"><label for="file">Importar logo (PNG, JPG, SVG ou WebP)</label><input type="file" id="file" accept="image/*"></div>
    <div><label for="lbg">Fundo da logo</label><select id="lbg"><option value="circle">Círculo</option><option value="round">Quadrado arredondado</option><option value="square">Quadrado</option><option value="none">Sem fundo</option></select></div>
    <div></div>
    <div><span>Offset X: <b data-v="ox">0</b></span><input type="range" id="ox" min="-20" max="20" value="0"></div>
    <div><span>Offset Y: <b data-v="oy">0</b></span><input type="range" id="oy" min="-20" max="20" value="0"></div>
    <div><span>Tamanho: <b data-v="sz">120</b></span><input type="range" id="sz" min="25" max="250" value="120"></div>
    <div><span>Fundo da logo: <b data-v="ci">180</b></span><input type="range" id="ci" min="25" max="250" value="180"></div>
  </div>
  <button id="gen">Gerar QR Code</button>
  <p id="status" role="status">Digite um link e clique em Gerar QR Code.</p>
</section>
<section class="card prev">
  <h2>Pré-visualização</h2>
  <div id="box">O QR Code aparecerá aqui</div>
  <div class="btns">
    <select id="res" aria-label="Tamanho do PNG"><option value="512">PNG 512 px</option><option value="1024" selected>PNG 1024 px</option><option value="2048">PNG 2048 px</option></select>
    <button id="png" disabled>Salvar como PNG</button><button id="svg" disabled>Salvar como SVG</button><button id="cp" disabled>Copiar texto do QR</button>
  </div>
  <div id="test"></div>
</section>
</main>

 if(r.err){clearPreview();s.textContent=r.err;if(!silent&&r.f)$(r.f).focus();return}
 const t=r.text;
 try{current=buildSvg(t)}catch(e){clearPreview();s.textContent="Conteúdo grande demais para este nível de correção de erro.";return}
 current.text=t;$("box").innerHTML=current.svg;$("png").disabled=$("svg").disabled=$("cp").disabled=false;runTest(t);
 s.textContent=(!$("tr").checked&&lum($("fg").value)>lum($("bg").value))?"Gerado, mas o QR está mais claro que o fundo: alguns leitores podem não conseguir ler.":"QR Code gerado com sucesso.";
}
let timer;const later=()=>{clearTimeout(timer);timer=setTimeout(()=>generate(true),200)};
document.querySelectorAll("input,select,textarea").forEach(el=>{if(el.id==="file"||el.id==="res")return;
 el.addEventListener("input",()=>{const v=document.querySelector(`[data-v="${el.id}"]`);if(v)v.textContent=el.value;later()});
 el.addEventListener("change",later)});
$("url").addEventListener("keydown",e=>{if(e.key==="Enter"){generate(false);e.preventDefault()}});
$("gen").addEventListener("click",()=>generate(false));
$("file").addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;
 if(!f.type.startsWith("image/")||f.size>3e6){$("status").textContent="Escolha uma imagem de até 3 MB.";return}
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
   custom={url:r.result,w:im.naturalWidth||150,h:im.naturalHeight||150};
   let op=$("logo").querySelector('[value="custom"]');if(!op){op=new Option("Personalizada","custom");$("logo").add(op)}
   $("logo").value="custom";generate(true);$("status").textContent="Logo importada: "+f.name};
  im.onerror=()=>{$("status").textContent="Não foi possível ler essa imagem."};im.src=r.result};r.readAsDataURL(f)});
let tab="link",testId=0;
const tlv=(i,v)=>i+String(v.length).padStart(2,"0")+v;
const clean=(s,m)=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").toUpperCase().trim().slice(0,m);
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function pix(){
 const kr=pixKey();if(kr.err)return kr;const k=kr.k;
 const nm=clean($("pn").value,25),ct=clean($("pc").value,15);
 if(!nm)return{err:"Informe o nome do recebedor.",f:"pn"};
 if(!ct)return{err:"Informe a cidade.",f:"pc"};
 let v=$("pv").value.trim().replace(",",".");
 if(v){const x=parseFloat(v);if(!(x>0)||x>=1e10)return{err:"Valor inválido.",f:"pv"};v=x.toFixed(2)}
 const tx=$("pt").value.replace(/[^A-Za-z0-9]/g,"").slice(0,25)||"***",ds=clean($("pd").value,40);
 if(k.length+ds.length>73)return{err:"Chave e mensagem somam caracteres demais.",f:"pd"};
 const p=tlv("00","01")+tlv("01","11")+tlv("26",tlv("00","br.gov.bcb.pix")+tlv("01",k)+(ds?tlv("02",ds):""))+tlv("52","0000")+tlv("53","986")+(v?tlv("54",v):"")+tlv("58","BR")+tlv("59",nm)+tlv("60",ct)+tlv("62",tlv("05",tx))+"6304";
 return{text:p+crc16(p)};
}
function getContent(){
 if(tab==="link"){const t=$("url").value.trim();if(!t)return{err:"Digite uma URL ou link para gerar o QR Code.",f:"url"};if(!validUrl(t))return{err:"Informe um link válido começando com http:// ou https://.",f:"url"};return{text:t}}
 if(tab==="wa"){let n=$("wn").value.replace(/\D/g,"").replace(/^00/,"");
  if(!n)return{err:"Digite o número do WhatsApp com DDD.",f:"wn"};
  if(n.length<=11)n="55"+n;
  if(n.length<12||n.length>15)return{err:"Número inválido. Use DDD + número (ex.: 85 99999-9999).",f:"wn"};
  const m=$("wm").value.trim();return{text:"https://wa.me/"+n+(m?"?text="+encodeURIComponent(m):"")}}
 return pix();
}
const MASK={cpf:["000.000.000-00",11],cnpj:["00.000.000/0000-00",14],tel:["(00) 00000-0000",11]};
const PH={cpf:"000.000.000-00",cnpj:"00.000.000/0000-00",tel:"(85) 99999-9999",email:"nome@exemplo.com",rand:"123e4567-e89b-12d3-a456-426614174000"};
function mask(v,t){const m=MASK[t];if(!m)return v;const d=v.replace(/\D/g,"").slice(0,m[1]);let o="",i=0;for(const ch of m[0]){if(i>=d.length)break;if(ch==="0")o+=d[i++];else o+=ch}return o}
function cpfOk(d){if(/^(\d)\1+$/.test(d))return false;for(let n=9;n<11;n++){let s=0;for(let i=0;i<n;i++)s+=d[i]*(n+1-i);if((s*10%11%10)!==+d[n])return false}return true}
function pixKey(){const t=$("kt").value,v=$("pk").value.trim(),d=v.replace(/\D/g,"");
 if(!v)return{err:"Informe a chave Pix.",f:"pk"};
 if(t==="cpf"){if(d.length!==11||!cpfOk(d))return{err:"CPF inválido.",f:"pk"};return{k:d}}
 if(t==="cnpj"){if(d.length!==14)return{err:"CNPJ inválido.",f:"pk"};return{k:d}}
 if(t==="tel"){if(d.length<10||d.length>11)return{err:"Telefone inválido. Use (DDD) 99999-9999.",f:"pk"};return{k:"+55"+d}}
 if(t==="email"){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return{err:"E-mail inválido.",f:"pk"};return{k:v.toLowerCase()}}
 if(!/^[0-9a-fA-F-]{36}$/.test(v))return{err:"Chave aleatória inválida (36 caracteres).",f:"pk"};return{k:v.toLowerCase()}}
$("pk").addEventListener("input",()=>{$("pk").value=mask($("pk").value,$("kt").value)});
$("kt").addEventListener("change",()=>{$("pk").value=mask($("pk").value,$("kt").value);$("pk").placeholder=PH[$("kt").value]});
function clearPreview(){current=null;testId++;$("box").textContent="O QR Code aparecerá aqui";$("png").disabled=$("svg").disabled=$("cp").disabled=true;$("test").innerHTML=""}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",x===b));document.querySelectorAll(".pane").forEach(p=>p.hidden=p.id!=="p-"+tab);generate(true)}));
["wn","pk","pn","pc","pv","pt","pd"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter"){generate(false);e.preventDefault()}}));
$("cp").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(current.text);$("status").textContent="Texto copiado."}catch{$("status").textContent="Não foi possível copiar."}});
async function runTest(text){
 const id=++testId,box=$("test"),head="<b>Sempre teste seu QR code.</b>";
 if(typeof jsQR==="undefined"){box.innerHTML=head+'<div class="na">Leitor indisponível.</div>';return}
 box.innerHTML=head+"<div>Testando…</div>";
 const img=new Image();
 try{await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(current.svg)})}catch{return}
 const T=[["Tamanho normal (400 px)",400],["Pequeno (160 px)",160],["Muito pequeno (110 px)",110],["Câmera desfocada",220,"blur(1.5px)"],["Pouca luz e contraste baixo",300,"contrast(.45) brightness(.85)"]];
 let rows="",pass=0,tot=0;
 for(const [name,px,f] of T){
  await new Promise(r=>setTimeout(r));if(id!==testId)return;
  const pad=Math.round(px*.08),c=document.createElement("canvas");c.width=c.height=px+pad*2;
  const x=c.getContext("2d",{willReadFrequently:true});x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
  if(f){if(!("filter" in x)){rows+=`<li class="na">– ${name}: não suportado neste navegador</li>`;continue}x.filter=f}
  x.drawImage(img,pad,pad,px,px);
  let ok=false;try{const d=x.getImageData(0,0,c.width,c.height),r=jsQR(d.data,d.width,d.height);ok=!!r&&r.data===text}catch{}
  tot++;if(ok)pass++;rows+=`<li class="${ok?"ok":"bad"}">${ok?"✔":"✖"} ${name}</li>`;
 }
 if(id!==testId)return;
 box.innerHTML=head+`<ul>${rows}</ul><div class="${pass===tot?"ok":"bad"}">${pass} de ${tot} cenários lidos</div><div class="note">Simulação no navegador, mais rigorosa que a maioria dos celulares. Antes de imprimir, confirme com a câmera de 2 ou 3 aparelhos.</div>`;
}
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$("svg").addEventListener("click",()=>{if(!current)return;save(new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+current.svg],{type:"image/svg+xml"}),"qrcode.svg");$("status").textContent="SVG salvo."});
$("png").addEventListener("click",()=>{if(!current)return;
 const img=new Image(),u=URL.createObjectURL(new Blob([current.svg],{type:"image/svg+xml"})),px=+$("res").value;
 img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=px;c.getContext("2d").drawImage(img,0,0,px,px);URL.revokeObjectURL(u);
  c.toBlob(b=>{save(b,"qrcode.png");$("status").textContent="PNG salvo."},"image/png")};
 img.onerror=()=>{$("status").textContent="Não foi possível criar o PNG."};img.src=u});
</script>
</body>
